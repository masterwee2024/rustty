[package]
name = "rustty"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "A small PuTTY-style SSH terminal client built with Rust, egui and russh"
license = "MIT"

[[bin]]
name = "rustty"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "clipboard",
] }
egui = "0.37"
russh = { version = "0.65", default-features = false, features = [
    "ring",
    "rsa",
    "flate2",
] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "io-util",
    "sync",
] }
vt100 = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
rfd = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "clipboard",
    "x11",
    "wayland",
] }

[profile.release]
lto = "thin"
strip = true
